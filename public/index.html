<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urban Heat Mitigation — AI Treatment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --canopy:#0F1A20;
    --canopy-panel:#16242B;
    --canopy-panel-2:#1C2E36;
    --line:#283B43;
    --leaf:#8FBB6B;
    --leaf-dim:#5C8A52;
    --soil:#C99356;
    --mist:#EAF0E6;
    --mist-dim:#8CA0A6;
    --hot:#E0764F;
    --crit:#D9503A;
    --cold:#5B8DBE;
    --thermal-cool:#5B8DBE;
    --thermal-warm:#E0A93F;
    --thermal-hot:#D9503A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 700px 400px at 8% -5%, rgba(217,80,58,0.10), transparent 60%),
      radial-gradient(ellipse 700px 400px at 100% 100%, rgba(143,187,107,0.08), transparent 60%),
      var(--canopy);
    background-attachment:fixed;
    color:var(--mist);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding-bottom:60px;
  }

  header{
    max-width:1080px;
    margin:0 auto;
    padding:36px 24px 24px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    flex-wrap:wrap;
    gap:16px;
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;gap:14px;align-items:center;}
  .brand-leaf{
    width:44px;height:44px;
    display:flex;align-items:center;justify-content:center;
    background:var(--canopy-panel-2);
    border:1px solid var(--line);
    border-radius:12px;
    flex:none;
    box-shadow:0 0 18px rgba(217,80,58,0.12);
  }
  .brand h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:26px;
    margin:0 0 2px;
    letter-spacing:0.2px;
  }
  .brand p{
    margin:0;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--mist-dim);
    letter-spacing:0.4px;
  }
  .live-pill{
    display:flex;align-items:center;gap:8px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:1.2px;
    color:var(--mist-dim);
    background:var(--canopy-panel);
    border:1px solid var(--line);
    padding:8px 14px;
    border-radius:999px;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--crit);transition:background .3s;}
  .dot.ok{background:var(--leaf);box-shadow:0 0 10px rgba(143,187,107,0.7);}
  .dot.pending{background:var(--soil);animation:pulse 1.4s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  .warn-banner{
    max-width:1080px;
    margin:0 auto;
    padding:0 24px;
  }
  .warn-banner .box{
    background:rgba(217,80,58,0.12);
    border:1px solid rgba(217,80,58,0.4);
    color:#F0A48D;
    padding:12px 16px;
    border-radius:8px;
    font-size:13.5px;
    max-height:0;
    opacity:0;
    overflow:hidden;
    margin-top:0;
    padding-top:0;
    padding-bottom:0;
    border-width:0;
    transition:max-height .35s ease, opacity .3s ease, margin-top .35s ease, padding .35s ease, border-width .35s ease;
  }
  .warn-banner .box.show{
    max-height:120px;
    opacity:1;
    margin-top:20px;
    padding-top:12px;
    padding-bottom:12px;
    border-width:1px;
  }

  main{
    max-width:1080px;
    margin:0 auto;
    padding:28px 24px 0;
  }

  .grid{
    display:grid;
    grid-template-columns:340px 1fr;
    gap:20px;
  }
  @media (max-width:760px){ .grid{grid-template-columns:1fr;} }

  .col-left{display:flex;flex-direction:column;gap:20px;}

  .panel{
    background:var(--canopy-panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:24px;
    transition:border-color .25s ease, transform .25s ease;
  }
  .panel:hover{border-color:#39525b;transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,0.22);}

  @keyframes fadeInUp{
    from{opacity:0;transform:translateY(6px);}
    to{opacity:1;transform:translateY(0);}
  }
  .grid, .chart-panel{animation:fadeInUp .4s ease;}

  @media (max-width:480px){
    header{padding:24px 16px 18px;}
    .brand h1{font-size:21px;}
    .brand p{font-size:10.5px;}
    main{padding:20px 16px 0;}
    .panel{padding:18px;}
    .gauge-num{font-size:38px;}
    .rec-status{font-size:19px;}
    .mini-stat .value{font-size:25px;}
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:1.4px;
    text-transform:uppercase;
    color:var(--mist-dim);
    margin:0 0 18px;
  }

  /* Gauge suhu permukaan */
  .gauge-card{text-align:center;}
  .gauge-svg-wrap{position:relative;width:100%;display:flex;justify-content:center;}
  .gauge-readout{
    position:absolute;
    top:64px;left:0;right:0;
    display:flex;flex-direction:column;align-items:center;
  }
  .gauge-num{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:46px;
    line-height:1;
  }
  .gauge-num sup{font-size:20px;font-weight:500;color:var(--mist-dim);}
  .status-badge{
    display:inline-block;
    margin-top:14px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    font-weight:600;
    letter-spacing:0.6px;
    padding:6px 16px;
    border-radius:999px;
    border:1px solid currentColor;
    transition:color .4s ease, background .4s ease;
  }
  .gauge-num{transition:color .4s ease;}
  .mini-stat .icon, .mini-stat svg path{transition:background .4s ease, stroke .4s ease;}

  /* Mini stat suhu ruang */
  .mini-stat{display:flex;align-items:center;justify-content:space-between;}
  .mini-stat .label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:var(--mist-dim);
  }
  .mini-stat .value{
    font-family:'Fraunces',serif;
    font-size:30px;
    font-weight:600;
    margin-top:6px;
  }
  .mini-stat .icon{
    width:38px;height:38px;
    border-radius:10px;
    background:var(--canopy-panel-2);
    display:flex;align-items:center;justify-content:center;
    flex:none;
  }
  .mini-timestamp{
    margin-top:14px;padding-top:14px;
    border-top:1px solid var(--line);
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--mist-dim);
  }

  /* Rekomendasi */
  .rec-panel{display:flex;flex-direction:column;}
  .rec-status{
    font-family:'Fraunces',serif;
    font-size:23px;
    font-weight:600;
    margin:0 0 8px;
  }
  .rec-alasan{
    color:var(--mist-dim);
    font-size:14.5px;
    line-height:1.6;
    margin:0 0 22px;
    padding-bottom:22px;
    border-bottom:1px solid var(--line);
  }
  .rec-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;}
  .rec-list li{display:flex;gap:14px;align-items:flex-start;font-size:14.5px;line-height:1.55;}
  .video-toggle-btn{
    background:rgba(143,187,107,0.1);
    border:1px solid rgba(143,187,107,0.3);
    color:var(--leaf);
    font-family:'Inter',sans-serif;
    font-size:12.5px;
    font-weight:500;
    padding:6px 12px;
    border-radius:6px;
    cursor:pointer;
    transition:filter .2s ease;
  }
  .video-toggle-btn:hover{filter:brightness(1.25);}
  .video-embed{margin-top:10px;border-radius:8px;overflow:hidden;}
  .video-embed iframe{display:block;border-radius:8px;}
  .leaf-bullet{flex:none;margin-top:2px;}
  .sumber-tag{
    margin-top:20px;
    align-self:flex-start;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:0.6px;
    text-transform:uppercase;
    color:var(--leaf-dim);
    background:rgba(143,187,107,0.1);
    border:1px solid rgba(143,187,107,0.25);
    padding:5px 12px;
    border-radius:999px;
  }
  .sumber-tag.fallback{
    color:var(--soil);
    background:rgba(201,147,86,0.1);
    border-color:rgba(201,147,86,0.3);
  }

  .chart-panel{margin-top:20px;}
  .chart-panel .eyebrow{margin-bottom:8px;}
  #chartHistori{max-height:230px;margin-top:12px;}

  .state-msg{
    text-align:center;
    padding:80px 20px;
    color:var(--mist-dim);
  }
  .state-msg .glyph{font-size:30px;margin-bottom:14px;opacity:0.7;}
  .state-msg p{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    margin:0;
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-leaf">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <defs>
          <linearGradient id="headGrad" x1="0" y1="24" x2="24" y2="0">
            <stop id="headGradStop1" offset="0" stop-color="#D9503A"/>
            <stop id="headGradStop2" offset="1" stop-color="#E0A93F"/>
          </linearGradient>
        </defs>
        <path d="M11 3a2 2 0 0 1 4 0v9.5a4 4 0 1 1-4 0V3Z" stroke="url(#headGrad)" stroke-width="1.4" fill="rgba(217,80,58,0.12)"/>
        <path d="M16 6.5h4.5M17.5 10h3.5M18.5 13.5h2.5" stroke="url(#headGrad)" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
    </div>
    <div>
      <h1>Urban Heat Mitigation</h1>
      <p>MLX90614 + ESP32 · AI TREATMENT RECOMMENDATION</p>
    </div>
  </div>
  <div class="live-pill"><span class="dot pending" id="dot"></span><span id="statusText">Menghubungkan...</span></div>
</header>

<div class="warn-banner"><div class="box" id="warnBox">⚠️ Gagal mengambil data dari server. Pastikan ESP32 menyala dan backend berjalan.</div></div>

<main id="mainContent">
  <div class="state-msg"><div class="glyph">🌡️</div><p>Belum ada data — menunggu pembacaan pertama dari sensor...</p></div>
</main>

<script>
const REFRESH_MS = 5000;
const ANGGAP_OFFLINE_SETELAH_MS = 5 * 60 * 1000; // kalau data terakhir lebih tua dari 5 menit, anggap sensor offline
let waktuTerakhirDirender = null; // hindari render ulang DOM kalau data belum berubah (biar video tutorial nggak ke-reset)

// Perpustakaan video tutorial, dicocokkan berdasarkan kategori rekomendasi dari AI
const VIDEO_TUTORIAL = {
  penyiraman: { judul: 'Cara Menyiram Tanaman yang Baik dan Benar', id: 'gbA5dJ_CW68' },
  mulsa: { judul: 'Cara Membuat Mulsa Organik di Musim Kemarau', id: '8lNu_WqAj-U' },
  naungan: { judul: 'Cara Pasang Naungan Paranet untuk Tanaman', id: 'EY9KstFlevg' }
};
let sudahAdaData = false;

function toggleVideo(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

function warnaStatus(suhu) {
  if (suhu > 45) return 'var(--crit)';
  if (suhu > 38) return 'var(--hot)';
  if (suhu >= 25) return 'var(--leaf)';
  if (suhu >= 15) return 'var(--cold)';
  return '#3F6B94';
}

function warnaGradPair(suhu) {
  if (suhu > 45) return ['#D9503A', '#B23223'];
  if (suhu > 38) return ['#E0764F', '#D9503A'];
  if (suhu >= 25) return ['#8FBB6B', '#5C8A52'];
  if (suhu >= 15) return ['#5B8DBE', '#3F6B94'];
  return ['#3F6B94', '#274A66'];
}

function updateHeaderIcon(suhu) {
  const [c1, c2] = warnaGradPair(suhu);
  const s1 = document.getElementById('headGradStop1');
  const s2 = document.getElementById('headGradStop2');
  if (s1) s1.setAttribute('stop-color', c1);
  if (s2) s2.setAttribute('stop-color', c2);
}

function leafBullet(warna){
  return `<svg class="leaf-bullet" width="20" height="20" viewBox="0 0 24 24" fill="none">
    <path d="M12 2C7 2 3 6 3 12c0 5 3.5 9 9 10 5.5-1 9-5 9-10 0-6-4-10-9-10Z" stroke="${warna}" stroke-width="1.4" fill="${warna}22"/>
    <path d="M12 21V8" stroke="${warna}" stroke-width="1.2" stroke-linecap="round"/>
  </svg>`;
}

function buatGauge(suhuPermukaan) {
  const warna = warnaStatus(suhuPermukaan);
  const persen = Math.min(Math.max((suhuPermukaan + 10) / 60, 0), 1); // skala -10..50C
  const sudut = persen * 180;
  const r = 92, cx = 130, cy = 120;
  const rad = (180 - sudut) * Math.PI / 180;
  const x = cx + r * Math.cos(rad);
  const y = cy - r * Math.sin(rad);
  return `
  <svg viewBox="0 0 260 140" width="260" height="140" style="max-width:100%;height:auto;display:block;margin:0 auto;">
    <defs>
      <linearGradient id="gaugeGrad" gradientUnits="userSpaceOnUse" x1="20" y1="0" x2="240" y2="0">
        <stop offset="0" stop-color="var(--thermal-cool)"/>
        <stop offset="0.4" stop-color="var(--leaf)"/>
        <stop offset="0.7" stop-color="var(--thermal-warm)"/>
        <stop offset="1" stop-color="var(--thermal-hot)"/>
      </linearGradient>
    </defs>
    <path d="M 38 120 A 92 92 0 0 1 222 120" fill="none" stroke="var(--canopy-panel-2)" stroke-width="12" stroke-linecap="round"/>
    <path d="M 38 120 A 92 92 0 0 1 ${x.toFixed(1)} ${y.toFixed(1)}" fill="none" stroke="url(#gaugeGrad)" stroke-width="12" stroke-linecap="round"/>
    <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="8.5" fill="${warna}" stroke="var(--canopy)" stroke-width="2.5"/>
  </svg>`;
}

function render(entry, historiArr) {
  sudahAdaData = true;
  const main = document.getElementById('mainContent');
  const warna = warnaStatus(entry.suhuPermukaan);
  updateHeaderIcon(entry.suhuPermukaan);

  main.innerHTML = `
    <div class="grid">
      <div class="col-left">
        <div class="panel gauge-card">
          <p class="eyebrow">Suhu Permukaan Tanah</p>
          <div class="gauge-svg-wrap">
            ${buatGauge(entry.suhuPermukaan)}
            <div class="gauge-readout">
              <div class="gauge-num" style="color:${warna};">${entry.suhuPermukaan.toFixed(1)}<sup>&deg;C</sup></div>
            </div>
          </div>
          <div class="status-badge" style="color:${warna};background:${warna}1a;">${entry.status}</div>
        </div>

        <div class="panel">
          <div class="mini-stat">
            <div>
              <p class="label">Suhu Ruang</p>
              <div class="value">${entry.suhuRuang.toFixed(1)}&deg;C</div>
            </div>
            <div class="icon" style="background:${warna}1f;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 3v10.5a4 4 0 1 1-4 0V3a2 2 0 0 1 4 0Z" stroke="${warna}" stroke-width="1.4"/></svg>
            </div>
          </div>
          <div class="mini-timestamp">Update terakhir · ${new Date(entry.waktu).toLocaleTimeString('id-ID')}</div>
        </div>
      </div>

      <div class="panel rec-panel">
        <p class="eyebrow">Rekomendasi Pengelolaan Tanah</p>
        <p class="rec-status" style="color:${warna};">${entry.status}</p>
        <p class="rec-alasan">${entry.alasan}</p>
        <ul class="rec-list">
          ${entry.rekomendasi.map((r, i) => {
            const teks = typeof r === 'string' ? r : r.langkah;
            const kategori = typeof r === 'string' ? null : r.kategori;
            const video = kategori ? VIDEO_TUTORIAL[kategori] : null;
            const videoElId = `video-${i}`;
            return `<li>
              ${leafBullet(warna)}
              <div style="flex:1;">
                <span>${teks}</span>
                ${video ? `
                  <div style="margin-top:8px;">
                    <button class="video-toggle-btn" style="color:${warna};border-color:${warna}55;background:${warna}1a;" onclick="toggleVideo('${videoElId}')">▶ Tonton tutorial: ${video.judul}</button>
                    <div id="${videoElId}" class="video-embed" style="display:none;">
                      <iframe width="100%" height="200" src="https://www.youtube.com/embed/${video.id}" title="${video.judul}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>
                    </div>
                  </div>` : ''}
              </div>
            </li>`;
          }).join('')}
        </ul>
        <span class="sumber-tag ${entry.sumber === 'ai' ? '' : 'fallback'}" ${entry.sumber === 'ai' ? `style="color:${warna};background:${warna}1a;border-color:${warna}55;"` : ''}>${entry.sumber === 'ai' ? '✦ Dianalisis oleh Gemini AI' : '⚠ Aturan cadangan — AI tidak tersedia'}</span>
      </div>
    </div>

    <div class="panel chart-panel">
      <p class="eyebrow">Grafik Suhu Ruang &amp; Permukaan</p>
      <div id="chartHistori"></div>
    </div>
  `;

  const ctx = document.getElementById('chartHistori');
  try {
    if (historiArr.length < 2) {
      throw new Error('Butuh minimal 2 titik data untuk menggambar grafik');
    }
    const W = 900, H = 230, padL = 40, padR = 16, padT = 16, padB = 28;
    const innerW = W - padL - padR, innerH = H - padT - padB;

    const semuaSuhu = historiArr.flatMap(h => [h.suhuPermukaan, h.suhuRuang]);
    const suhuMin = Math.floor(Math.min(...semuaSuhu) - 3);
    const suhuMax = Math.ceil(Math.max(...semuaSuhu) + 3);

    const xAt = i => padL + (i / (historiArr.length - 1)) * innerW;
    const yAt = v => padT + innerH - ((v - suhuMin) / (suhuMax - suhuMin)) * innerH;

    const buatPath = (key) => historiArr.map((h, i) => `${i === 0 ? 'M' : 'L'} ${xAt(i).toFixed(1)} ${yAt(h[key]).toFixed(1)}`).join(' ');
    const pathPermukaan = buatPath('suhuPermukaan');
    const pathRuang = buatPath('suhuRuang');
    const areaPermukaan = `${pathPermukaan} L ${xAt(historiArr.length - 1).toFixed(1)} ${(padT + innerH).toFixed(1)} L ${xAt(0).toFixed(1)} ${(padT + innerH).toFixed(1)} Z`;

    // Garis bantu horizontal (grid) sederhana, 4 baris
    let gridLines = '';
    let gridLabels = '';
    for (let g = 0; g <= 3; g++) {
      const v = suhuMin + (g / 3) * (suhuMax - suhuMin);
      const y = yAt(v);
      gridLines += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W - padR}" y2="${y.toFixed(1)}" stroke="#283B43" stroke-width="1"/>`;
      gridLabels += `<text x="${padL - 8}" y="${(y + 3).toFixed(1)}" text-anchor="end" font-size="10" fill="#8CA0A6" font-family="IBM Plex Mono, monospace">${v.toFixed(0)}&deg;</text>`;
    }

    // Label waktu di sumbu-x: tampilkan awal, tengah, akhir aja biar nggak numpuk
    const idxLabel = [0, Math.floor((historiArr.length - 1) / 2), historiArr.length - 1];
    let xLabels = '';
    idxLabel.forEach(i => {
      const t = new Date(historiArr[i].waktu).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
      xLabels += `<text x="${xAt(i).toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="10" fill="#8CA0A6" font-family="IBM Plex Mono, monospace">${t}</text>`;
    });

    ctx.innerHTML = `
      <svg viewBox="0 0 ${W} ${H}" width="100%" style="max-height:230px;">
        <defs>
          <linearGradient id="chartLineGrad" gradientUnits="userSpaceOnUse" x1="0" y1="${padT}" x2="0" y2="${padT + innerH}">
            <stop offset="0" stop-color="var(--thermal-hot)"/>
            <stop offset="0.3" stop-color="var(--thermal-warm)"/>
            <stop offset="0.6" stop-color="var(--leaf)"/>
            <stop offset="1" stop-color="var(--thermal-cool)"/>
          </linearGradient>
        </defs>
        ${gridLines}
        ${gridLabels}
        ${xLabels}
        <path d="${areaPermukaan}" fill="url(#chartLineGrad)" fill-opacity="0.14" stroke="none"/>
        <path d="${pathPermukaan}" fill="none" stroke="url(#chartLineGrad)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
        <path d="${pathRuang}" fill="none" stroke="#8FBB6B" stroke-width="2" stroke-dasharray="5,4" stroke-linejoin="round" stroke-linecap="round"/>
      </svg>
      <div style="display:flex;gap:20px;margin-top:10px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--mist-dim);">
        <span><span style="display:inline-block;width:10px;height:10px;background:linear-gradient(90deg,var(--thermal-cool),var(--leaf),var(--thermal-warm),var(--thermal-hot));border-radius:2px;margin-right:6px;"></span>Suhu Permukaan</span>
        <span><span style="display:inline-block;width:10px;height:10px;background:#8FBB6B;border-radius:2px;margin-right:6px;"></span>Suhu Ruang</span>
      </div>`;
  } catch (chartErr) {
    console.error('Grafik belum bisa ditampilkan:', chartErr);
    ctx.innerHTML = `<p style="color:var(--mist-dim);font-size:13px;font-family:'IBM Plex Mono',monospace;padding:20px 0;">
      🌡️ Grafik akan muncul setelah ada minimal 2 pembacaan sensor.
    </p>`;
  }
}

async function ambilData() {
  const dot = document.getElementById('dot');
  const statusText = document.getElementById('statusText');
  const warnBox = document.getElementById('warnBox');

  try {
    const [latestRes, historyRes] = await Promise.all([
      fetch('/api/latest'),
      fetch('/api/history?limit=30')
    ]);

    if (!latestRes.ok) {
      dot.className = 'dot pending';
      statusText.textContent = 'Belum ada data';
      warnBox.classList.remove('show');
      return;
    }

    const latest = await latestRes.json();
    const history = await historyRes.json();
    if (latest.waktu !== waktuTerakhirDirender) {
      render(latest, history);
      waktuTerakhirDirender = latest.waktu;
    }

    const umurData = Date.now() - new Date(latest.waktu).getTime();
    if (umurData > ANGGAP_OFFLINE_SETELAH_MS) {
      dot.className = 'dot';
      statusText.textContent = 'Sensor offline';
      warnBox.textContent = '⚠ Data terakhir sudah lebih dari 5 menit lalu. Server aktif, tapi sensor ESP32 kemungkinan mati/terputus.';
      warnBox.classList.add('show');
    } else {
      dot.className = 'dot ok';
      statusText.textContent = 'Terhubung';
      warnBox.classList.remove('show');
    }
  } catch (err) {
    dot.className = 'dot';
    statusText.textContent = 'Terputus';
    warnBox.textContent = '⚠️ Gagal mengambil data dari server. Pastikan server berjalan dan URL benar.';
    warnBox.classList.add('show');
    console.error(err);
  }
}

ambilData();
setInterval(ambilData, REFRESH_MS);
</script>
